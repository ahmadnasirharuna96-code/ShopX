name: ShopX Docker Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ShopX
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ShopX Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: shopx:test
