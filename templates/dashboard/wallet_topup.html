{% extends "base.html" %}

{% block title %}Add Funds - ShopX{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
  <h1 class="text-2xl font-bold text-slate-900 mb-4">Add Funds to Commission Wallet</h1>
  <form method="post">
    {% csrf_token %}
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Amount (NGN)</label>
        <input type="number" min="100" step="100" name="amount" required class="w-full rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold px-4 py-3 rounded-xl shadow-sm">Continue to Paystack</button>
    </div>
  </form>

  <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md">
    <div class="bg-white/90 backdrop-blur border border-slate-200 shadow-lg rounded-2xl p-2 flex items-center justify-between gap-2">
      <a href="{% url 'commission-dashboard' %}" class="flex-1 text-center px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-100">Home</a>
      <a href="{% url 'commission-history' %}" class="flex-1 text-center px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 hover:bg-slate-100">History</a>
      <a href="{% url 'commission-wallet-topup' %}" class="flex-1 text-center px-3 py-2 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500">Top Up</a>
    </div>
  </div>
</div>
{% endblock %}
