{% extends "shop/base_shop.html" %}
{% block title %}Report a Problem{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto py-8">
  <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
    <h2 class="text-2xl font-bold text-white mb-4">Report a Problem</h2>
    <p class="text-gray-400 mb-6">Order #{{ order.order_number }} • {{ order.business.name }}</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm text-gray-300 mb-2">Category</label>
        <select name="category" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white">
          <option value="ORDER_PROBLEM">Order Problem</option>
          <option value="PRODUCT_PROBLEM">Product Problem</option>
          <option value="DELIVERY_PROBLEM">Delivery Problem</option>
          <option value="BUSINESS_COMPLAINT">Business Complaint</option>
          <option value="OTHER">Other</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-2">Subject</label>
        <input type="text" name="subject" value="Issue for Order #{{ order.order_number }}" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white">
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-2">Description</label>
        <textarea name="description" rows="5" class="w-full bg-gray-950 border border-gray-700 rounded-xl p-3 text-white" placeholder="Describe the issue..."></textarea>
      </div>
      <button type="submit" class="bg-red-600 text-white px-5 py-2 rounded-xl font-semibold">Create Support Ticket</button>
    </form>
  </div>
</div>
{% endblock %}
